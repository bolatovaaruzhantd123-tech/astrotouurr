const validPages=['index','places','map','sky','planner','guide'];
function readRoute(){
  const hash=window.location.hash.replace(/^#\/?/,'');
  const split=hash.indexOf('?');
  const page=split<0?hash:hash.slice(0,split);
  return {page:validPages.includes(page)?page:'index',params:new URLSearchParams(split<0?'':hash.slice(split+1))};
}

function atlasRandom(n,salt=0){const v=Math.sin(n*127.1+salt*311.7)*43758.5453123;return v-Math.floor(v)}
function renderConstellation(){
 const svg=$('#constellationSvg');if(!svg)return;
 const c=constellationInfo[constellation];
 const defs=`<defs><radialGradient id="atlasNebula"><stop stop-color="#7a548d" stop-opacity=".27"/><stop offset=".5" stop-color="#31386c" stop-opacity=".12"/><stop offset="1" stop-color="#080d1c" stop-opacity="0"/></radialGradient><radialGradient id="atlasNebulaB"><stop stop-color="#4e7a99" stop-opacity=".2"/><stop offset="1" stop-color="#0b1021" stop-opacity="0"/></radialGradient><linearGradient id="starGlow"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#ccc6ff"/></linearGradient></defs>`;
 let stars='';for(let i=0;i<atlasDensity;i++){
  const x=7+atlasRandom(i,3)*406,y=5+atlasRandom(i,8)*290;
  const sizeSeed=atlasRandom(i,4), radius=sizeSeed>.988?1.75:sizeSeed>.9?1.18:sizeSeed>.55?.72:.39;

  const color=i%17===0?'#ffd5ac':i%13===0?'#a5c6ff':'#e6eaff';
  stars+=`<circle class="ambient-star" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="${radius}" fill="${color}" opacity="${bright.toFixed(2)}" style="--twinkle-delay:${(atlasRandom(i,12)*8).toFixed(2)}s;--twinkle-duration:${(2.7+atlasRandom(i,9)*4.2).toFixed(2)}s"/>`;
 }
 const paths=c.edges.map(([a,b])=>`<path class="star-line" d="M${c.points[a][0]} ${c.points[a][1]} L${c.points[b][0]} ${c.points[b][1]}"/>`).join('');
 const nodes=c.points.map(([x,y],i)=>`<g><circle cx="${x}" cy="${y}" r="${i%3===0?11:8}" fill="#aca1ff" opacity=".12"/><circle class="star-core" cx="${x}" cy="${y}" r="${i%4===0?4:2.8}"/><circle cx="${x}" cy="${y}" r="${i%4===0?1.75:1.1}" fill="#fff"/></g>`).join('');
 svg.innerHTML=defs+`<rect width="420" height="300" fill="transparent"/><ellipse cx="260" cy="135" rx="245" ry="95" fill="url(#atlasNebula)" transform="rotate(-28 260 135)"/><ellipse cx="115" cy="220" rx="200" ry="130" fill="url(#atlasNebulaB)"/>`+stars+`<g class="constellation-pattern">${paths}${nodes}</g>`;
 const hint=$('.atlas-hint');if(hint)hint.textContent='✧ '+t('atlasHint')+' · '+t('atlas'+constellation[0].toUpperCase()+constellation.slice(1));
 $$('.constellation-controls [data-const]').forEach(b=>{const active=b.dataset.const===constellation;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
 $$('.density-buttons [data-density]').forEach(b=>{const active=Number(b.dataset.density)===atlasDensity;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});

}

function setupStars(){const canvas=$('#starCanvas');if(!canvas)return ()=>{};const cx=canvas.getContext('2d');if(!cx)return ()=>{};const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;let w,h,stars=[],frame=0,raf=0,stopped=false;function resize(){const ratio=Math.min(window.devicePixelRatio||1,1.7);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);cx.setTransform(ratio,0,0,ratio,0,0);stars=Array.from({length:Math.min(165,Math.floor(w*h/6000))},(_,i)=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.2+.25,o:Math.random()*.65+.2,seed:i*.4}))}function draw(){if(stopped)return;cx.clearRect(0,0,w,h);stars.forEach((s,i)=>{cx.globalAlpha=s.o*(reduced?1:.78+.22*Math.sin(frame*.012+s.seed));cx.fillStyle=i%11===0?'#f7c8a0':'#cdd5f8';cx.beginPath();cx.arc(s.x,s.y,s.r,0,2*Math.PI);cx.fill()});cx.globalAlpha=1;if(!reduced){frame++;raf=requestAnimationFrame(draw)}}window.addEventListener('resize',resize,{passive:true});resize();draw();return ()=>{stopped=true;cancelAnimationFrame(raf);window.removeEventListener('resize',resize)}}

 en:{eyebrow:'05 / TRAVEL FIELD GUIDE',title:'Ready for a night <span class="grad">under the stars?</span>',lead:'Everything that matters in one place: when to go, what to pack, how to stay safe, and your saved destinations.',check:'Before you depart',checkDesc:'Review these essentials before each trip.',checks:[['Access and route','Verify park rules, opening hours, permits and the return route.'],['Weather and moonlight','Check cloud cover, wind, temperature and the Moon phase separately.'],['Safety first','Travel in a group, share your itinerary and carry water and backup power.'],['Leave no trace','Use permitted trails, pack out waste and respect wildlife.']],seasons:'When should you stargaze?',seasonsDesc:'A general seasonal overview for Kazakhstan; visibility varies with latitude, light pollution and weather.',seasonRows:[['WINTER','December — February','Winter constellations such as Orion. Pack layers and plan safe travel.'],['SPRING','March — May','Seasonal constellations shift and weather varies; check road conditions.'],['SUMMER','June — August','Milder nights; the Perseid meteor shower is usually active in August.'],['AUTUMN','September — November','Longer nights; cool and dry conditions may occasionally bring clear skies.']],gear:'Packing checklist',gearDesc:'Tick what you have packed. Your checklist is saved in this browser.',gearList:['Warm layers and sturdy shoes','Red-light torch','Water and snacks','Power bank and communications','Offline map and first-aid kit','Tripod / binoculars (optional)'],saved:'Your saved destinations',savedDesc:'Places you marked with a heart appear here.',empty:'No saved places yet. Tap ♡ on a destination card.',learn:'Helpful resources',learnDesc:'Explore astronomy and responsible stargazing through trusted resources.',faq:'Frequently asked questions',faqs:[['Why does a new Moon help?','With less moonlight, faint stars and the Milky Way may be easier to see. Clouds and artificial lights also matter.'],['Can I camp in any na function guidePage(){const g=G[lang],checked=store.get('astrotour-gear-v6',[]);return `<main>${makePageHead(g.eyebrow,g.title,g.lead,'05')}<section class="section guide-top"><div class="shell"><div class="section-intro"><div><div class="eyebrow">FIELD NOTES / 01</div><h2 class="section-title display">${g.check}</h2></div><p class="section-desc">${g.checkDesc}</p></div><div class="guide-check-grid">${g.checks.map(([name,desc],i)=>`<article class="guide-step"><div class="guide-number">0${i+1} / 04</div><h3>${name}</h3><p>${desc}</p></article>`).join('')}</div></div></section><section class="section alt-section"><div class="shell"><div class="section-intro"><div><div class="eyebrow">NIGHT SKY / 02</div><h2 class="section-title display">${g.seasons}</h2></div><p class="section-desc">${g.seasonsDesc}</p></div><div class="season-grid">${g.seasonRows.map(([season,months,detail],i)=>`<div class="season-card"><span class="season-ico">${['❄','✿','☀','☾'][i]}</span><span class="season-num">0${i+1}</span><h3>${season}</h3><b>${months}</b><p>${detail}</p></div>`).join('')}</div><div class="guide-note">✧ ${g.sample}</div></div></section><section class="section"><div class="shell guide-columns"><div><div class="eyebrow">PREPARE / 03</div><h2 class="section-title display">${g.gear}</h2><p class="section-desc">${g.gearDesc}</p><div class="packing-list">${g.gearList.map((item,i)=>`<label class="pack-item"><input type="checkbox" data-gear="${i}" ${checked.includes(i)?'checked':''}><span>${item}</span></label>`).join('')}</div></div><aside class="guide-note-panel"><span class="sky-glyph">✧</span><div class="eyebrow">EXPLORE THE SKY</div><h3>${t('skyHead')}</h3><p>${t('skyDescription')}</p><a class="btn primary" href="${url('sky')}">${g.starGuide} ↗</a></aside></div></section><section class="section alt-section"><div class="shell"><div class="section-intro"><div><div class="eyebrow">YOUR COLLECTION / 04</div><h2 class="section-title display">${g.saved}</h2></div><p class="section-desc">${g.savedDesc}</p></div><div class="spot-grid" id="guideFavs">${P.filter(p=>favs.has(p.id)).map(card).join('')||`<div class="empty">♡<p>${g.empty}</p></div>`}</div><a class="btn guide-all" href="${url('places')}">${g.viewAll} ↗</a></div></section><section class="section"><div class="shell faq-layout"><div><div class="eyebrow">FAQ / 05</div><h2 class="section-title display">${g.faq}</h2><p class="section-desc">${g.learnDesc}</p><div class="verified-links"><a href="https://science.nasa.gov/moon/" target="_blank" rel="noopener noreferrer">NASA / Moon science ↗</a><a href="https://darksky.org/" target="_blank" rel="noopener noreferrer">DarkSky International ↗</a></div></div><div class="faq-list">${g.faqs.map(([q,a])=>`<details class="faq-item"><summary>${q}<span>+</span></summary><p>${a}</p></details>`).join('')}</div></div></section><section class="section about-band"><div class="shell"><div class="guide-about"><span class="guide-orbit">◎</span><div><div class="eyebrow">WHY ASTROTOUR?</div><h2 class="section-title display">${g.aboutTitle}</h2><p>${g.aboutText}</p></div><a href="${url('planner')}" class="btn primary">${t('navGo')} ↗</a></div></div></section></main>`}
function render(){document.documentElement.lang=lang==='kk'?'kk':lang;document.title='AstroTour KZ — '+t(currentPage==='index'?'navHome':currentPage==='places'?'navPlaces':currentPage==='map'?'navMap':currentPage==='sky'?'navSky':('nav'+currentPage[0].toUpperCase()+currentPage.slice(1)));if(starCleanup)starCleanup();const app=$('#app');const templates={index:homePage,places:placesPage,map:mapPage,sky:skyPage,planner:plannerPage,guide:guidePage};app.innerHTML=makeHeader()+(templates[currentPage]||homePage)()+makeFooter()+`<div id="toast" class="toast" aria-live="polite"></div><div id="modal" class="modal"></div>`;
  $('#menuToggle').addEventListener('click',()=>{const menu=$('#mobileDrawer');const opened=menu.classList.toggle('open');$('#menuToggle').textContent=opened?'×':'☰';$('#menuToggle').setAttribute('aria-expanded',String(opened))});$$('[data-lang]').forEach(b=>b.addEventListener('click',()=>changeLang(b.dataset.lang)));
  if(currentPage==='places'){renderPlaces();$('#searchInput').addEventListener('input',ev=>{query=ev.target.value;renderPlaces()});$('#filters').addEventListener('click',ev=>{const b=ev.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderPlaces()})}
  if(currentPage==='map'){renderMapDetails();$('#interactivePins').addEventListener('click',ev=>{const g=ev.target.closest('[data-pin]');if(g){activePin=g.dataset.pin;renderMapDetails()}});$('#interactivePins').addEventListener('keydown',ev=>{const g=ev.target.closest('[data-pin]');if(g&&['Enter',' '].includes(ev.key)){ev.preventDefault();activePin=g.dataset.pin;renderMapDetails();g.focus()}})}
  if(currentPage==='sky'){renderConstellation();renderMoon();$$('[data-const]').forEach(b=>b.addEventListener('click',()=>{constellation=b.dataset.const;renderConstellation()}));$$('[data-density]').forEach(b=>b.addEventListener('click',()=>{atlasDensity=Number(b.dataset.density);store.set('astrotour-atlas-density',atlasDensity);renderConstellation()}))}
  if(currentPage==='guide'){$$('[data-gear]').forEach(el=>el.addEventListener('change',()=>{const arr=$$('[data-gear]:checked').map(c=>Number(c.dataset.gear));store.set('astrotour-gear-v6',arr)}))}
  if(currentPage==='planner'){renderPlanPreview();$$('#tripForm select, #tripForm input').forEach(n=>{n.addEventListener('change',()=>{readForm();renderPlanPreview()})});$('#tripForm').addEventListener('submit',ev=>{ev.preventDefault();readForm();latestPlan={...planValues};store.set('astrotour-last-plan-3',latestPlan);renderResult();toast(t('routeReady'));$('#tripResult').scrollIntoView({behavior:'smooth',block:'nearest'})});renderResult()}

function globalClick(ev){const fav=ev.target.closest('[data-fav]');if(fav){toggleFav(fav.dataset.fav);return}const details=ev.target.closest('[data-details]');if(details){showPlaceModal(details.dataset.details);return}if(ev.target.closest('#closeModal')||ev.target.id==='modal'){closeModal();return}if(ev.target.closest('[data-download]')){download();return}if(ev.target.closest('[data-print]')){window.print()}}
// Hash navigation also works on file:// and supports Back/Forward and deep links.
window.addEventListener('hashchange',()=>{
  const next=readRoute();
  if(currentPage==='planner')readForm();
  closeModal();
  currentPage=next.page;
  params=next.params;
  const requestedLang=params.get('lang');
  if(allow.includes(requestedLang)){
    lang=requestedLang;
    store.set('astrotour-lang-3',lang);
  }
  if(params.has('place')){
    const id=params.get('place');
    if(P.some(p=>p.id===id)){
      activePin=id;
      planValues.place=id;
    }
  }
  render();
  window.scrollTo(0,0);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});document.addEventListener('click',globalClick);render();
