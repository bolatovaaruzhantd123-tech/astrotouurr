.sky-stage,.sky-info-card,.moon-science,.map-stage,.panel{border-radius:20px;border:1px solid rgba(201,213,255,.17)}.sky-stage{background:radial-gradient(circle at center,rgba(28,43,76,.75),#0b1328 75%);padding:15px}.sky-stage canvas{filter:drop-shadow(0 0 28px rgba(61,110,230,.09))}.sky-info-card{background:linear-gradient(145deg,rgba(30,37,66,.75),rgba(12,18,34,.96))}.sky-controls select,.sky-controls input,.expedition-form input,.expedition-form select,.search input,.compact-select select{border-radius:11px!important;background:#141b30!important;border-color:rgba(214,220,252,.21)!important;color:#f5f6ff!important;min-height:45px}.canvas-controls button{border-radius:10px}.sky-info-card h3{font-size:20px}.work-tabs,.workspace-tabs{border-radius:16px}.workspace-tabs button{border-radius:11px}.mission-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 20px}.mission-strip>a{padding:17px 20px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.035);display:flex;gap:12px;align-items:center;font-weight:700;font-size:12px}.mission-strip>a:hover{border-color:rgba(248,190,157,.6)}.mission-strip>a>span{font-size:23px;color:#f3b999}
.site-footer{background:#060a15;border-top:1px solid rgba(255,255,255,.1)}.science-note{border-left:2px solid #dda18d;padding:15px 19px;font-size:12px;color:#bfcbdc;background:rgba(255,255,255,.025);border-radius:0 13px 13px 0}
/* enhanced home feature cards */
.wow-section-feature .feature-tile{min-height:304px}.wow-section-feature .feature-tile:nth-child(1){background:radial-gradient(ellipse at 90% 15%,rgba(76,125,209,.26),transparent 58%),linear-gradient(150deg,#19243c,#0c1222)}.wow-section-feature .feature-tile:nth-child(2){background:radial-gradient(ellipse at 85% 5%,rgba(146,94,202,.26),transparent 59%),linear-gradient(150deg,#222141,#0c1222)}.wow-section-feature .feature-tile:nth-child(3){background:radial-gradient(ellipse at 95% 10%,rgba(251,159,109,.19),transparent 62%),linear-gradient(150deg,#2a2138,#0c1222)}.wow-card-top{display:flex;align-items:center;justify-content:space-between;gap:15px;color:#c8d4ef;font-size:10px;letter-spacing:.17em}.wow-card-orbit{height:94px;position:relative;display:grid;place-items:center;margin:4px 0 12px}.wow-card-orbit:before,.wow-card-orbit:after{content:'';position:absolute;border:1px solid rgba(177,196,246,.25);border-radius:50%;width:118px;height:43px;transform:rotate(-23deg)}.wow-card-orbit:after{transform:rotate(60deg);width:105px;height:52px}.wow-card-orbit span{display:grid;place-items:center;width:49px;height:49px;border-radius:50%;background:radial-gradient(circle at 28% 23%,#ffe2ca,#b57eae 51%,#1a2950 78%);box-shadow:0 0 33px rgba(227,165,207,.2);z-index:1;font-size:22px;color:#1d223c}.wow-card-map{height:94px;display:flex;align-items:center;justify-content:center;margin:4px 0 12px;position:relative}.wow-card-map svg{max-width:188px;width:100%;filter:drop-shadow(0 0 14px rgba(135,180,239,.16))}.wow-card-progress{height:94px;margin:4px 0 12px;display:grid;place-items:center;position:relative}.wow-card-progress:before{content:'';height:92px;width:92px;position:absolute;border-radius:50%;background:conic-gradient(#f4bc99 0 23%,rgba(255,255,255,.13) 23% 100%);mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 0)}.wow-card-progress b{font-size:28px;color:#fff}.wow-card-progress small{font-size:9px;color:#d7bdb5;position:absolute;top:67px}
.wow-mini-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.13);padding:5px 10px;border-radius:25px;font-size:9px;letter-spacing:.08em;color:#c3d1ea}.wow-mini-pill i{height:6px;width:6px;background:#99ecce;border-radius:50%;box-shadow:0 0 9px #99ecce}.science-ribbon{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap;border-radius:17px;background:linear-gradient(105deg,rgba(35,48,79,.8),rgba(38,24,43,.8));border:1px solid rgba(255,255,255,.14);padding:27px 32px}.science-ribbon h3{margin:0 0 6px;font-size:20px}.science-ribbon p{margin:0;color:#b7c1d8;font-size:12px;max-width:570px}.science-ribbon a{flex-shrink:0}
/* interaction: command palette */
.wow-command-backdrop{position:fixed;inset:0;z-index:250;background:rgba(2,4,12,.77);backdrop-filter:blur(13px);display:grid;align-items:start;justify-items:center;padding:15vh 20px 40px;overflow-y:auto}.wow-command-backdrop[hidden]{display:none!important}.wow-command{width:min(620px,100%);border:1px solid rgba(227,229,255,.26);background:linear-gradient(160deg,#1a223b,#0e152a);box-shadow:0 40px 120px rgba(0,0,0,.68);border-radius:23px;overflow:hidden}.wow-command-head{display:flex;gap:12px;align-items:center;padding:17px 20px;border-bottom:1px solid rgba(255,255,255,.1)}.wow-command-head input{width:100%;font-size:15px;color:#fff;background:transparent;border:0;outline:0}.wow-command-head kbd{color:#a6b1ca;font-size:10px;border:1px solid #49516d;padding:5px;border-radius:6px}.wow-command-results{padding:12px;max-height:460px;overflow:auto}.wow-result{border:0;background:transparent;color:#ecf1ff;width:100%;display:flex;align-items:center;gap:14px;padding:13px 12px;text-align:left;border-radius:12px;cursor:pointer}.wow-result:hover,.wow-result:focus-visible{background:rgba(242,188,157,.10);outline:1px solid rgba(242,188,157,.3)}.wow-result>span:first-child{font-size:22px;min-width:30px}.wow-result strong{display:block;font-size:13px}.wow-result small{display:block;color:#a6b4d0;font-size:11px}.wow-command-bottom{padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);color:#a3b0cd;font-size:10px;display:flex;justify-content:space-between}

const omega=125.04-1934.136*T,lam=trueLong-.00569-.00478*Math.sin(omega*deg),eps=23.439291-.0130042*T+.00256*Math.cos(omega*deg),dec=Math.asin(Math.sin(eps*deg)*Math.sin(lam*deg));
const y=Math.tan(eps*deg/2)**2,eq=4*rad*(y*Math.sin(2*L0*deg)-2*e*Math.sin(M*deg)+4*e*y*Math.sin(M*deg)*Math.cos(2*L0*deg)-.5*y*y*Math.sin(4*L0*deg)-1.25*e*e*Math.sin(2*M*deg));
const mins=time.getUTCHours()*60+time.getUTCMinutes()+time.getUTCSeconds()/60,tst=((mins+eq+4*lon)%1440+1440)%1440,hour=(tst/4-180)*deg,alt=Math.asin(Math.sin(lat*deg)*Math.sin(dec)+Math.cos(lat*deg)*Math.cos(dec)*Math.cos(hour))*rad;return alt}

function planetCalc(date,p){
  const deg=Math.PI/180,turn=x=>(x%360+360)%360;
  const jd=date.getTime()/86400000+2440587.5;
  const T=(jd-2451545.0)/36525,day=jd-2451545.0;
  const elements={
    Mercury:[[.38709927,.00000037],[.20563593,.00001906],[7.00497902,-.00594749],[252.25032350,149472.67411175],[77.45779628,.16047689],[48.33076593,-.12534081]],

    Earth:[[1.00000261,.00000562],[.01671123,-.00004392],[-.00001531,-.01294668],[100.46457166,35999.37244981],[102.93768193,.32327364],[0,0]],
    Mars:[[1.52371034,.00001847],[.09339410,.00007882],[1.84969142,-.00813131],[-4.55343205,19140.30268499],[-23.94362959,.44441088],[49.55953891,-.29257343]],
    Jupiter:[[5.20288700,-.00011607],[.04838624,-.00013253],[1.30439695,-.00183714],[34.39644051,3034.74612775],[14.72847983,.21252668],[100.47390909,.20469106]],
    Saturn:[[9.53667594,-.00125060],[.05386179,-.00050991],[2.48599187,.00193609],[49.95424423,1222.49362201],[92.59887831,-.41897216],[113.66242448,-.28867794]]
  };
  function heliocentric(name){
    const [a,e,i,L,peri,node]=elements[name].map(([v,w])=>v+w*T), M=turn(L-peri)*deg;
    let E=M;for(let j=0;j<8;j++)E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
    const xv=a*(Math.cos(E)-e),yv=a*Math.sqrt(1-e*e)*Math.sin(E),v=Math.atan2(yv,xv),r=Math.hypot(xv,yv);
    const Omega=node*deg,inc=i*deg,w=(peri-node)*deg,phi=v+w;
    return {x:r*(Math.cos(Omega)*Math.cos(phi)-Math.sin(Omega)*Math.sin(phi)*Math.cos(inc)),
            y:r*(Math.sin(Omega)*Math.cos(phi)+Math.cos(Omega)*Math.sin(phi)*Math.cos(inc)),
            z:r*Math.sin(phi)*Math.sin(inc)};
  }
  const earth=heliocentric('Earth'),eps=(23.439291-.0130042*T)*deg;
  function local(ecl){
    const yy=ecl.y*Math.cos(eps)-ecl.z*Math.sin(eps),zz=ecl.y*Math.sin(eps)+ecl.z*Math.cos(eps);
    const ra=turn(Math.atan2(yy,ecl.x)/deg)/15,dec=Math.atan2(zz,Math.hypot(ecl.x,yy))/deg;
    return horizontal(ra,dec,date,p.lat,p.lon);
  }
  const out=['Mercury','Venus','Mars','Jupiter','Saturn'].map(name=>{
    const v=heliocentric(name),q=local({x:v.x-earth.x,y:v.y-earth.y,z:v.z-earth.z});
    return {name:name+' ≈',az:q.az,alt:q.alt};
  });
  const mean=turn(218.316+13.176396*day),anom=turn(134.963+13.064993*day),arg=turn(93.272+13.229350*day);

  out.push({name:'Moon ≈',az:q.az,alt:q.alt});
  return out;
}

function renderWorkspace(){const el=$('#workspace');if(!el)return;el.innerHTML=({passport:passportTab,quest:questTab,ai:aiTab,science:scienceTab})[activeTab]();$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));if(activeTab==='passport')$('#observationForm').addEventListener('submit',saveObservation);if(activeTab==='quest'){const q=$('#questForm');if(q)q.addEventListener('submit',answerQuest)}if(activeTab==='ai')$('#chatForm').addEventListener('submit',sendChat)}
async function compressImage(file){if(!file)return null;if(file.size>8*1024*1024)throw Error('Photo too large');return new Promise((resolve,reject)=>{const img=new Image(),reader=new FileReader();reader.onerror=reject;reader.onload=()=>{img.onload=()=>{let w=img.width,h=img.height,scale=Math.min(1,700/Math.max(w,h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.65))};img.onerror=reject;img.src=reader.result};reader.readAsDataURL(file)})}

async function getWeather(p=pick(),targetDay=null){
const selectedDate=targetDay?new Date(targetDay+'T22:00:00'):null;
const daysAhead=selectedDate?(selectedDate.getTime()-Date.now())/86400000:null;
if(selectedDate&&(isNaN(selectedDate)||daysAhead>15||daysAhead<-.5))return null;
const isForecast=Boolean(selectedDate&&daysAhead>0.15);
const query=isForecast?'hourly=temperature_2m,cloud_cover,wind_speed_10m&forecast_days=16':'current=temperature_2m,cloud_cover,wind_speed_10m&forecast_days=1';
const link=`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&${query}&timezone=auto`;
try{const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),9000);let res;try{res=await fetch(link,{signal:ctrl.signal})}finally{clearTimeout(to)}if(!res.ok)throw Error(res.status);const j=await res.json();let cur=j.current||{},stamp=cur.time||'';
if(isForecast){const data=j.hourly||{},idx=(data.time||[]).indexOf(targetDay+'T22:00');if(idx<0)throw Error('Forecast time missing');cur={cloud_cover:data.cloud_cover?.[idx],temperature_2m:data.temperature_2m?.[idx],wind_speed_10m:data.wind_speed_10m?.[idx]};stamp=data.time[idx]}
if(typeof cur.cloud_cover!=='number')throw Error('Missing cloud data');return {location:p.id,cloud:cur.cloud_cover,temp:cur.temperature_2m,wind:cur.wind_speed_10m,time:stamp.replace('T',' '),kind:isForecast?'forecast':'current',source:'Open-Meteo'}}catch{return null}}

function geolocate(){if(!navigator.geolocation){notice(tx('locateFail'));return}navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude}=pos.coords;const nearest=P.slice().sort((a,b)=>Math.hypot(a.lat-latitude,a.lon-longitude)-Math.hypot(b.lat-latitude,b.lon-longitude))[0];selected=nearest.id;save('selected',selected);notice(`${tx('choose')}: ${localName(nearest)} · ${tx('approx')}`);if(page==='index')refreshWeather();else if(page==='map'){let sel=$('#mapPlace');if(sel)sel.value=selected;mapBody();refreshWeather()}else if(page==='sky'){let s=$('#skyPlace');if(s)s.value=selected;drawSky();refreshWeather()}},()=>notice(tx('locateFail')),{timeout:10000,enableHighAccuracy:false})}

an><b>${p.lat}°N · ${p.lon}°E</b></div><div class="info-line"><span>${tx('season')}</span><b>${h(best(p))}</b></div><div class="quiet-note">${tx('access')}. ${tx('noRating')}.</div><div class="action-row"><button class="btn primary" data-plan="${p.id}">${tx('openRoute')} ↗</button><a class="btn" href="${h(p.source)}" target="_blank" rel="noopener noreferrer">${tx('dataSource')} ↗</a></div></div></article>`;m.classList.add('show');document.body.style.overflow='hidden'}

function globalActions(ev){let b;if((b=ev.target.closest('[data-detail]'))){showModal(b.dataset.detail);return}if((b=ev.target.closest('[data-plan]'))){save('selected',b.dataset.plan);go('planner',{place:b.dataset.plan});return}if((b=ev.target.closest('[data-fav]'))){let old=read('favorites',[]),id=b.dataset.fav;save('favorites',old.includes(id)?old.filter(x=>x!==id):[...old,id]);b.classList.toggle('saved');b.textContent=b.classList.contains('saved')?'♥':'♡';if(page==='places'&&$('[data-filter].active')?.dataset.filter==='saved')renderPlaces();notice(tx('savedOk'));return}if((b=ev.target.closest('[data-select]'))){selected=b.dataset.select;save('selected',selected);$('#mapPlace').value=selected;mapBody();return}if((b=ev.target.closest('[data-view]'))){mapUI=b.dataset.view;mapBody();return}if((b=ev.target.closest('[data-delmeasure]'))){save('measurements',read('measurements',[]).filter(x=>x.id!==b.dataset.delmeasure));renderMeasures();notice(tx('deletedOk'));return}if((b=ev.target.closest('[data-delobs]'))){save('observations',read('observations',[]).filter(x=>x.id!==b.dataset.delobs));renderWorkspace();notice(tx('deletedOk'));return}if((b=ev.target.closest('[data-gear]'))){let set=new Set(read('gear',[])),n=Number(b.dataset.gear);b.checked?set.add(n):set.delete(n);save('gear',[...set]);return}if(ev.target.closest('#exportObservations')){downloadText('astrotour-passport.json',JSON.stringify({app:'AstroTour KZ',exported:new Date().toISOString(),observations:read('observations',[])},null,2),'application/json');return}if(ev.target.closest('#nextQuestion')){save('qIndex',read('qIndex',0)+1);save('answered',null);renderWorkspace();return}if(ev.target.closest('#restartQuest')){save('qIndex',0);save('score',0);save('answered',null);renderWorkspace();return}if((b=ev.target.closest('[data-suggest]'))){let el=$('#aiInput');if(el){el.value=b.dataset.suggest;el.focus()}return}if(ev.target.closest('#modalClose')||ev.target.id==='modalBackdrop'){closeModal();return}}
document.addEventListener('click',globalActions);document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(cameraStream)toggleAR()}});window.addEventListener('beforeunload',()=>{if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop())});

<script id="wow-edition-extras">
/* AstroTour KZ · global quick-search / command center */
(function(){

let dialog=null,input=null,list=null,focusBack=null;

function initNight(){if(document.getElementById('astrotourNightToggle'))return;let mode=false;try{mode=localStorage.getItem('astrotour-night-view')==='1'}catch{}const btn=document.createElement('button');btn.id='astrotourNightToggle';btn.type='button';btn.innerHTML='<span class="night-dot"></span><span class="night-label"></span>';document.body.appendChild(btn);function update(){document.body.classList.toggle('night-vision',mode);btn.setAttribute('aria-pressed',String(mode));btn.querySelector('.night-label').textContent=(document.documentElement.lang==='en'?'Night vision':'Түнгі режим')+(mode?' · ON':'');btn.title=document.documentElement.lang==='en'?'Dim red display for field observations; lower your device brightness as well.':'Түнгі бақылауға арналған қызыл реңк; экран жарықтығын да азайтыңыз.'}btn.addEventListener('click',()=>{mode=!mode;try{localStorage.setItem('astrotour-night-view',mode?'1':'0')}catch{}update()});update()}
function init(){if(document.getElementById('wowCommand'))return;initNight();dialog=document.createElement('div');dialog.className='wow-command-backdrop';dialog.id='wowCommand';dialog.hidden=true;dialog.innerHTML='<div class="wow-command" role="dialog" aria-modal="true" aria-label="Search AstroTour"><div class="wow-command-head"><span style="font-size:22px;color:#f7bb9b">⌕</span><input id="wowCommandInput" type="search" autocomplete="off" placeholder="Іздеу / Search ..." aria-label="Search"><kbd>ESC</kbd></div><div class="wow-command-results" id="wowCommandResults"></div><div class="wow-command-bottom"><span>↑ ↓ · Enter · Esc</span><span>ASTRO TOUR KZ · OBSERVATORY</span></div></div>';document.body.appendChild(dialog);input=dialog.querySelector('input');list=dialog.querySelector('#wowCommandResults');dialog.addEventListener('click',e=>{if(e.target===dialog)close()});input.addEventListener('input',filter);input.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();list.querySelector('.wow-result')?.focus()}});list.addEventListener('keydown',e=>{const buttons=[...list.querySelectorAll('.wow-result')],index=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'){e.preventDefault();buttons[(index+1)%buttons.length]?.focus()}else if(e.key==='ArrowUp'){e.preventDefault();if(index<=0)input.focus();else buttons[index-1].focus()}else if(e.key==='Escape'){e.preventDefault();close()}});document.getElementById('wowSearch')?.addEventListener('click',open)}
